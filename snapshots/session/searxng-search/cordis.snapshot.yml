# Keyless replay keeps the SearXNG provider and HTTP request real.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: ['off', 'low', 'high', 'max']
                defaultReasoningEffort: max
              - id: deepseek-v4-pro


- insert:
    - id: searxng-fixture
      name: './searxng-fixture.mjs'

- id: web-search-searxng
  config:
    enabled: true
    baseURL: http://searxng.snapshot.invalid

- id: web-search-deepseek
  config:
    apiKey: ''
    apiKeyEnv: SEARXNG_SNAPSHOT_MISSING_KEY
    baseURL: http://deepseek.snapshot.invalid
