- id: llm-deepseek
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
# Exercise the real optional browser provider through the shipped headless profile.
- insert:
    - id: browser-control
      name: '../../../Custom Plugins/browser-control/index.js'
      config:
        backend: playwright
        homepage: about:blank
        headless: true

# Keep machine-local skills outside this browser-only scenario.
- id: skill-filesystem
  disabled: true
- id: skill-badge
  disabled: true
- id: tool-skill
  disabled: true
