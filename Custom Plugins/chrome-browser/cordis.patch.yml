- insert:
    - id: browser-control
      name: dsh-chrome-browser
      config:
        backend: chrome
        homepage: https://www.google.com/
        chromeEndpoint: http://127.0.0.1:9222
        headless: true
        defaultTimeoutMs: 10000
        navigationTimeoutMs: 30000
        maxSnapshotChars: 24000
        maxDiagnostics: 100
        artifactDir: .dsh/qa-artifacts
    - id: browser-controller
      name: '@deepseek-ai/dsh-api-browser-controller'
    - id: ui-browser
      name: '@deepseek-ai/dsh-client-ui-browser'
